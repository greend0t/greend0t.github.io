<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chờ Ngày Em Trở Về</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Quicksand', sans-serif;
            background: linear-gradient(135deg, #1b2612 0%, #0d1408 100%);
            min-height: 100svh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #d4e09b;
            overflow-x: hidden;
            margin: 0;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 2.5rem;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 10;
            
        }

        .countdown-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 1.5rem;
            padding: 1.25rem;
            min-width: 80px;
            text-align: center;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.3);
        }

        .progress-bar {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            height: 10px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4f772d, #90a955, #ecf39e);
            width: 0%;
            transition: width 1s ease-in-out;
            box-shadow: 0 0 15px rgba(144, 169, 85, 0.4);
        }

        .heart-icon {
            color: #ff4d6d;
            animation: heartBeat 2s infinite;
            filter: drop-shadow(0 0 8px rgba(255, 77, 109, 0.4));
        }

        @keyframes heartBeat {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 0.8; }
        }

        .petal {
            position: absolute;
            background-color: #ffb7c5;
            border-radius: 150% 0 150% 0;
            opacity: 0.2;
            pointer-events: none;
            z-index: 1;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% { transform: translate(0, -10%) rotate(0deg); opacity: 0; }
            10% { opacity: 0.4; }
            90% { opacity: 0.4; }
            100% { transform: translate(100px, 100vh) rotate(360deg); opacity: 0; }
        }

        .photo-frame {
            width: 88px;
            height: 88px;
            margin: 0 auto 20px;
            border-radius: 50%;
            border: 2px solid rgba(212, 224, 155, 0.2);
            padding: 5px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        @media (min-width: 390px) {
            .photo-frame {
                width: 120px;
                height: 120px;
            }
        }        

        .photo-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            display: none; /* Ẩn mặc định cho đến khi có link ảnh */
        }

        .mystery-silhouete {
            opacity: 0.3;
        }
    </style>
</head>
<body>
    <div id="petals-container"></div>

    <div class="container mx-auto px-4 py-8 max-w-xl">
        <div class="glass-card p-6 md:p-12 text-center">
            
            <div class="photo-frame">
                <!-- THAY LINK ẢNH CỦA CÔ ẤY VÀO ĐÂY: src="đường-dẫn-ảnh" -->
                <img id="girl-photo" src="./img/1.jpg" alt="Photo" onerror="this.style.display='none'; document.getElementById('placeholder-icon').style.display='block';">
                
                <div id="placeholder-icon" class="text-lime-200/30 mystery-silhouete">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-12 h-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                    </svg>
                </div>
            </div>

            <div class="flex justify-center mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 heart-icon" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                </svg>
            </div>

            <h1 class="text-xl md:text-2xl font-bold mb-2 text-white tracking-widest uppercase">Chờ Ngày Em Trở Về</h1>
            <p class="text-[9px] uppercase tracking-[0.3em] text-lime-500/40 mb-6">Trân trọng • Kiên nhẫn • GMT+7</p>
            
            <p id="daily-quote" class="text-sm md:text-base mb-10 text-gray-400 italic px-6 leading-relaxed min-h-[3rem]">
                "Chỉ cần biết em vẫn bình an hoàn thành nhiệm vụ..."
            </p>

            <div class="grid grid-cols-4 gap-2 mb-8">
                <div class="countdown-item">
                    <span id="days" class="text-xl md:text-3xl font-bold block text-white">00</span>
                    <span class="text-[8px] md:text-[9px] uppercase opacity-50">Ngày</span>
                </div>
                <div class="countdown-item">
                    <span id="hours" class="text-xl md:text-3xl font-bold block text-white">00</span>
                    <span class="text-[8px] md:text-[9px] uppercase opacity-50">Giờ</span>
                </div>
                <div class="countdown-item">
                    <span id="minutes" class="text-xl md:text-3xl font-bold block text-white">00</span>
                    <span class="text-[8px] md:text-[9px] uppercase opacity-50">Phút</span>
                </div>
                <div class="countdown-item">
                    <span id="seconds" class="text-xl md:text-3xl font-bold block text-white">00</span>
                    <span class="text-[8px] md:text-[9px] uppercase opacity-50">Giây</span>
                </div>
            </div>

            <div class="mb-4">
                <div class="flex justify-between mb-3 text-[10px] font-bold uppercase tracking-widest text-gray-500">
                    <span>Thử thách: <span id="percent-text" class="text-lime-400">0%</span></span>
                    <span id="status-text">Đang kiên trì chờ đợi...</span>
                </div>
                <div class="progress-bar">
                    <div id="progress-fill" class="progress-fill"></div>
                </div>
            </div>

            <p id="days-remaining-label" class="text-[11px] text-gray-500 mt-4 font-medium italic"></p>
        </div>
    </div>

    <script>
        // --- CÀI ĐẶT NGÀY TẠI ĐÂY ---
        const START_DATE_VAL = '2026-01-05T05:00:00'; 
        const TARGET_DATE_VAL = '2026-01-21T08:00:00'; 
        // ------------------------------

        const quotes = [
            "Thao trường nắng gió, nhưng có người vẫn ngóng em từng giây...",
            "Dù kết quả thế nào, quan trọng nhất vẫn là em đã hoàn thành tốt nhiệm vụ.",
            "Đợi em giữa những ngày nắng cháy, để thấy nụ cười ngày trở về.",
            "Khoảng cách không xa nếu chúng ta coi nhau là tất cả.",
            "Màu áo xanh kiên cường, tấm lòng anh mãi hướng về em.",
            "Anh vẫn ở đây, ủng hộ em từ xa, dù chúng mình có gặp nhau hay không.",
            "Mong em sớm trở lại với cuộc sống thường nhật thật rạng rỡ.",
            "Thao trường vất vả rồi, ngày về hãy dành thời gian cho bản thân thật tốt nhé.",
            "Anh không hứa sẽ đợi được mãi mãi, nhưng anh hứa sẽ đợi đến khi em sẵn sàng.",
            "Sự hiện diện của em là điều ý nghĩa nhất, mọi thứ khác đều có thể tùy duyên.",
            "Hẹn gặp em vào một ngày mà cả hai chúng ta đều cảm thấy thoải mái nhất."
        ];

        const startDate = new Date(START_DATE_VAL);
        const targetDate = new Date(TARGET_DATE_VAL);

        document.getElementById('daily-quote').innerText = '"' + quotes[Math.floor(Math.random() * quotes.length)] + '"';

        // Tự động hiển thị ảnh nếu có link hợp lệ
        const imgElement = document.getElementById('girl-photo');
        if (imgElement.getAttribute('src') !== "") {
            imgElement.style.display = 'block';
            document.getElementById('placeholder-icon').style.display = 'none';
        }

        function updateCountdown() {
            const now = new Date();
            const difference = targetDate - now;

            if (difference <= 0) {
                document.getElementById('days').innerText = '00';
                document.getElementById('hours').innerText = '00';
                document.getElementById('minutes').innerText = '00';
                document.getElementById('seconds').innerText = '00';
                document.getElementById('status-text').innerText = 'Chúc mừng em đã hoàn thành khóa huấn luyện! 🌿';
                document.getElementById('progress-fill').style.width = '100%';
                document.getElementById('percent-text').innerText = '100%';
                document.getElementById('days-remaining-label').innerText = "Mong em có những ngày nghỉ ngơi thật xứng đáng.";
                return;
            }

            const d = Math.floor(difference / (1000 * 60 * 60 * 24));
            const h = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const m = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
            const s = Math.floor((difference % (1000 * 60)) / 1000);

            document.getElementById('days').innerText = d.toString().padStart(2, '0');
            document.getElementById('hours').innerText = h.toString().padStart(2, '0');
            document.getElementById('minutes').innerText = m.toString().padStart(2, '0');
            document.getElementById('seconds').innerText = s.toString().padStart(2, '0');

            const totalDuration = targetDate - startDate;
            const elapsed = now - startDate;
            let percent = Math.floor((elapsed / totalDuration) * 100);
            percent = Math.min(Math.max(percent, 0), 100);
            
            document.getElementById('progress-fill').style.width = percent + '%';
            document.getElementById('percent-text').innerText = percent + '%';
            document.getElementById('days-remaining-label').innerText = "Còn khoảng " + d + " ngày nữa là em hoàn thành rồi.";
        }

        function createPetals() {
            const container = document.getElementById('petals-container');
            const petalCount = 15;
            for (let i = 0; i < petalCount; i++) {
                const petal = document.createElement('div');
                petal.className = 'petal';
                const size = Math.random() * 8 + 4;
                petal.style.width = size + 'px';
                petal.style.height = size + 'px';
                petal.style.left = Math.random() * 100 + 'vw';
                petal.style.animationDuration = (Math.random() * 12 + 8) + 's';
                petal.style.animationDelay = (Math.random() * 8) + 's';
                container.appendChild(petal);
            }
        }

        createPetals();
        updateCountdown();
        setInterval(updateCountdown, 1000);
    </script>
</body>
</html>
